<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Join TOFU Media Team 🚀</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <div class="form-container">
            <h2>Join <span>TOFU Media</span> Team 🚀</h2>
            <p>ابعت لينا بياناتك عشان تتطور معانا</p>
            
            <!-- تم ضبط الإرسال المباشر للإيميل بدون وسيط -->
            <form id="applyForm" action="mailto:tofumedia0@gmail.com" method="post" enctype="text/plain">

                <!-- Name -->
                <div class="input-group">
                    <label for="name">الاسم بالكامل / Full Name :</label>
                    <input type="text" id="name" name="Full Name" required placeholder="اكتب اسمك بالكامل">
                </div>

                <!-- Email -->
                <div class="input-group">
                    <label for="email">البريد الإلكتروني / Email Address :</label>
                    <input type="email" id="email" name="Email" required placeholder="example@gmail.com">
                </div>

                <!-- Birth Year -->
                <div class="input-group">
                    <label for="birthYear">سنة الميلاد / Birth Year :</label>
                    <input type="number" id="birthYear" name="Birth Year" min="1950" max="2020" required placeholder="مثال: 2002">
                </div>

                <!-- Personal Phone -->
                <div class="input-group">
                    <label for="phone">رقم الهاتف / Phone Number :</label>
                    <input type="tel" id="phone" name="Phone Number" required placeholder="01xxxxxxxxx">
                </div>

                <!-- WhatsApp Phone -->
                <div class="input-group">
                    <label for="whatsapp">رقم الواتساب / WhatsApp Number :</label>
                    <input type="tel" id="whatsapp" name="WhatsApp Number" required placeholder="01xxxxxxxxx">            
                </div>

                <!-- Governorate -->
                <div class="input-group">
                    <label for="governorate">المحافظة / Governorate :</label>
                    <input type="text" id="governorate" name="Governorate" required placeholder="مثال: القاهرة، الإسكندرية...">
                </div>

                <!-- School / College Specialization -->
                <div class="input-group">
                    <label for="specialization">اسم المدرسة / الكلية والتخصص :</label>
                    <input type="text" id="specialization" name="School or College" required placeholder="مثال: مدرسه المنيره الثانويه بنات / كلية حاسبات ومعلومات">
                </div>

                <!-- Role / Track -->
                <div class="input-group">
                    <label for="role">المجال المطلوب / Applying For (Track) :</label>
                    <select id="role" name="Applying Track" required>
                        <option value="" disabled selected>اختر المجال المناسب لك</option>
                        <option value="Copywriter">Copywriter</option>
                        <option value="Designer and Editor">Designer / Editor</option> 
                        <option value="Marketing">Marketing</option>
                    </select>
                </div>

                <!-- Why Join Us -->
                <div class="input-group">
                    <label for="whyJoin">ليه حابب تنضم لتيم توفو؟ / Why do you want to join TOFU?</label>
                    <textarea id="whyJoin" name="Reason to Join" rows="4" required placeholder="اكتب لنا سبب اهتمامك بالانضمام للتيم..."></textarea>
                </div>

                <button type="submit" id="submitBtn">إرسال / Submit</button>
            </form>
        </div>

        <script src="script.js"></script>
    </body>
</html>
