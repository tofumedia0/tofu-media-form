<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم الاستلام بنجاح 🚀 - TOFU Media Team</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .success-card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        .icon-container {
            width: 80px;
            height: 80px;
            background-color: #e8f5e9;
            color: #2e7d32;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px auto;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 12px;
            font-size: 24px;
        }

        p {
            color: #555;
            font-size: 15px;
            line-height: 1.6;
            margin: 8px 0;
        }

        .highlight-text {
            color: #2e7d32;
            font-weight: bold;
        }

        .btn-home {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 30px;
            background-color: #007bff;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.25);
        }

        .btn-home:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="icon-container">✓</div>
        <h2>تم استلام طلبك بنجاح!</h2>
        <p>شكراً لاهتمامك بالانضمام إلى فريق <br><strong>TOFU Media Team</strong> 🚀</p>
        <p class="highlight-text">سيتم مراجعة بياناتك والرد عليك خلال 24 ساعة.</p>
        
        <a href="index.html" class="btn-home">العودة للصفحة الرئيسية 🏠</a>
    </div>

</body>
</html>
